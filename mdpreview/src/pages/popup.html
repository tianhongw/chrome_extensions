<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="icons/icon48.png" width="28" height="28" alt="" />
      <div>
        <div class="title" data-i18n="extName"></div>
        <div class="version" id="version"></div>
      </div>
    </header>

    <div class="notice" id="file-access" hidden>
      <span data-i18n="fileAccessOff"></span>
      <button type="button" class="link" id="file-access-fix" data-i18n="fileAccessFix"></button>
    </div>

    <label class="row">
      <span data-i18n="popupEnabled"></span>
      <input type="checkbox" class="switch" id="enabled" />
    </label>

    <div class="row">
      <span data-i18n="optTheme"></span>
      <div class="segmented" role="radiogroup">
        <label data-i18n-title="theme_auto"><input type="radio" name="theme" value="auto" /><span class="icon" data-icon="auto"></span></label>
        <label data-i18n-title="theme_light"><input type="radio" name="theme" value="light" /><span class="icon" data-icon="light"></span></label>
        <label data-i18n-title="theme_dark"><input type="radio" name="theme" value="dark" /><span class="icon" data-icon="dark"></span></label>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="render-page" hidden>
        <span class="icon" data-icon="eye"></span><span data-i18n="popupRenderPage"></span>
      </button>
      <button type="button" class="btn" id="open-editor">
        <span class="icon" data-icon="edit"></span><span data-i18n="popupOpenEditor"></span>
      </button>
      <button type="button" class="btn" id="open-options">
        <span class="icon" data-icon="settings"></span><span data-i18n="actionSettings"></span>
      </button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
