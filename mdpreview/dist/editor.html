<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="editor.css" />
    <style id="custom-css"></style>
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="icons/icon32.png" width="20" height="20" alt="" />
        <span data-i18n="editorTitle"></span>
      </div>
      <div class="file">
        <span id="file-name"></span>
        <span class="file-state" id="file-state" data-i18n="editorUnsaved" hidden></span>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost btn-icon" id="new" data-i18n-title="editorNew" data-icon="plus"></button>
        <button type="button" class="btn btn-ghost btn-icon" id="open" data-i18n-title="editorOpen" data-icon="folder"></button>
        <button type="button" class="btn btn-ghost btn-icon" id="save" data-i18n-title="editorSave" data-icon="save"></button>
        <div class="segmented" role="radiogroup" id="view">
          <label><input type="radio" name="view" value="edit" /><span data-i18n="viewEdit"></span></label>
          <label><input type="radio" name="view" value="split" /><span data-i18n="viewSplit"></span></label>
          <label><input type="radio" name="view" value="preview" /><span data-i18n="viewPreview"></span></label>
        </div>
        <button type="button" class="btn btn-ghost btn-icon" id="theme"></button>
        <button type="button" class="btn btn-ghost btn-icon" id="settings" data-i18n-title="actionSettings" data-icon="settings"></button>
      </div>
    </header>

    <main class="workspace" id="workspace" data-view="split">
      <section class="pane editor-pane">
        <textarea id="source" spellcheck="false" autocomplete="off" data-i18n-placeholder="editorPlaceholder"></textarea>
      </section>
      <section class="pane preview-pane" id="preview-pane">
        <article class="markdown-body" id="preview"></article>
      </section>
    </main>

    <div class="drop-zone" id="drop-zone" hidden><span data-i18n="editorDrop"></span></div>
    <div class="toast" id="toast" role="status"></div>
    <input type="file" id="file-input" accept=".md,.markdown,.mdown,.mkd,.mkdn,.txt,text/markdown,text/plain" hidden />
    <script src="editor.js"></script>
  </body>
</html>
